<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloud Storage - Render Secured</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 sm:p-6 font-sans">
  
  <!-- MÀN HÌNH ĐĂNG NHẬP -->
  <div id="loginScreen" class="fixed inset-0 bg-slate-950/95 backdrop-blur-md flex items-center justify-center z-50 p-4">
    <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 max-w-md w-full space-y-4 shadow-2xl">
      <div class="text-center space-y-1">
        <div class="text-4xl">🔐</div>
        <h2 class="text-xl font-bold text-indigo-400">Đăng Nhập Cloud Storage</h2>
        <p class="text-xs text-slate-400">Hệ thống bảo mật qua Render Server</p>
      </div>
      
      <div class="space-y-3">
        <input type="text" id="inputMTB" placeholder="Mã thiết bị (MTB)..." class="w-full bg-slate-900 border border-slate-700 text-sm px-4 py-2.5 rounded-xl outline-none focus:border-indigo-500 font-mono uppercase">
        <input type="password" id="inputMK" placeholder="Mật khẩu..." class="w-full bg-slate-900 border border-slate-700 text-sm px-4 py-2.5 rounded-xl outline-none focus:border-indigo-500">
      </div>
      
      <button onclick="loginWithCloud()" id="loginBtn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-xl transition">
        🔑 Xác Thực Đăng Nhập
      </button>
      <div id="loginStatus" class="text-xs text-center font-medium hidden"></div>
    </div>
  </div>

  <!-- GIAO DIỆN CHÍNH -->
  <div class="max-w-5xl mx-auto space-y-6">
    <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-bold text-indigo-400">⚡ Cloud Storage (Secured)</h1>
        <p id="userInfoBadge" class="text-xs text-slate-400 mt-1">Thiết bị: ...</p>
      </div>
      <button onclick="logout()" class="text-xs bg-rose-600/20 text-rose-300 border border-rose-500/30 px-3 py-2 rounded-xl">🚪 Đăng Xuất</button>
    </div>

    <!-- TẢI FILE -->
    <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 space-y-3">
      <div class="flex gap-3">
        <input type="file" id="fileInput" multiple class="block w-full text-sm text-slate-400 bg-slate-900 rounded-xl border border-slate-700 p-1">
        <button onclick="startBatchUploadQueue()" id="uploadBtn" class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold px-6 py-2.5 rounded-xl transition">📤 Tải Lên</button>
      </div>
      <div id="uploadStatus" class="text-xs text-indigo-400 font-semibold hidden"></div>
    </div>

    <!-- DANH SÁCH FILE -->
    <div class="bg-slate-800 rounded-2xl border border-slate-700 p-4">
      <h2 class="font-bold text-slate-200 mb-3">📂 Danh Sách File</h2>
      <table class="w-full text-left text-sm text-slate-300">
        <thead class="bg-slate-900/50 text-slate-400 text-xs uppercase">
          <tr>
            <th class="p-3">Tên file</th>
            <th class="p-3">Kích thước</th>
            <th class="p-3 text-right">Thao tác</th>
          </tr>
        </thead>
        <tbody id="fileTableBody" class="divide-y divide-slate-700/50">
          <tr><td colspan="3" class="p-4 text-center text-slate-500">Chưa có dữ liệu</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const CHUNK_SIZE = 20 * 1024 * 1024; // 20 MB
    let CURRENT_MTB = localStorage.getItem('cur_mtb') || null;
    let BOT_TOKEN = localStorage.getItem('cur_token') || null;
    let CHAT_ID = localStorage.getItem('cur_chatid') || null;
    let dbFiles = [];

    window.onload = async () => {
      if (CURRENT_MTB && BOT_TOKEN && CHAT_ID) {
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('userInfoBadge').innerText = `Thiết bị: ${CURRENT_MTB}`;
        await loadBackup();
      }
    };

    async function loginWithCloud() {
      const mtb = document.getElementById('inputMTB').value.trim().toUpperCase();
      const mk = document.getElementById('inputMK').value.trim();
      const statusDiv = document.getElementById('loginStatus');

      statusDiv.className = "text-xs text-center text-amber-400";
      statusDiv.innerText = "⏳ Đang xác thực qua Render Server...";
      statusDiv.classList.remove('hidden');

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ mtb, mk })
        });
        const data = await res.json();

        if (data.success) {
          CURRENT_MTB = mtb;
          BOT_TOKEN = data.token;
          CHAT_ID = data.chatId;

          localStorage.setItem('cur_mtb', CURRENT_MTB);
          localStorage.setItem('cur_token', BOT_TOKEN);
          localStorage.setItem('cur_chatid', CHAT_ID);

          document.getElementById('loginScreen').classList.add('hidden');
          document.getElementById('userInfoBadge').innerText = `Thiết bị: ${CURRENT_MTB}`;
          await loadBackup();
        } else {
          statusDiv.innerText = "❌ " + (data.message || "Sai tài khoản!");
        }
      } catch (err) {
        statusDiv.innerText = "❌ Lỗi kết nối Server Render!";
      }
    }

    async function loadBackup() {
      try {
        const res = await fetch(`/api/backup?mtb=${encodeURIComponent(CURRENT_MTB)}`);
        const listData = await res.json();
        if (listData && listData.length > 0) {
          const latestItem = listData[listData.length - 1];
          const fullData = (latestItem.mainData || "") + (latestItem.subData || "") || latestItem.backupData;
          dbFiles = typeof fullData === 'string' ? JSON.parse(fullData) : fullData;
        }
      } catch (e) {
        dbFiles = [];
      }
      renderFiles();
    }

    async function startBatchUploadQueue() {
      const files = Array.from(document.getElementById('fileInput').files);
      if (files.length === 0) return alert("Vui lòng chọn tệp!");

      const statusText = document.getElementById('uploadStatus');
      statusText.classList.remove('hidden');

      for (let file of files) {
        const totalChunks = Math.ceil(file.size / CHUNK_SIZE);
        const chunkIds = [];

        for (let i = 0; i < totalChunks; i++) {
          if (i > 0) await new Promise(r => setTimeout(r, 1500)); // Anti spam delay

          statusText.innerText = `📦 Đang tải ${file.name} (Mảnh ${i+1}/${totalChunks})...`;
          const start = i * CHUNK_SIZE;
          const chunkBlob = file.slice(start, Math.min(file.size, start + CHUNK_SIZE));

          const formData = new FormData();
          formData.append('token', BOT_TOKEN);
          formData.append('chatId', CHAT_ID);
          formData.append('document', chunkBlob, totalChunks > 1 ? `${file.name}.part${i+1}` : file.name);

          const res = await fetch('/api/upload-chunk', { method: 'POST', body: formData });
          const data = await res.json();

          if (data.success) {
            chunkIds.push(data.file_id);
          } else {
            alert(`Lỗi upload mảnh ${i+1}`);
            return;
          }
        }

        dbFiles.unshift({
          id: "file_" + Date.now(),
          name: file.name,
          size: file.size,
          chunks: chunkIds,
          date: new Date().toLocaleString('vi-VN')
        });
      }

      statusText.innerText = "🎉 Hoàn tất! Đang đồng bộ dữ liệu...";
      renderFiles();
      await saveBackup();
      statusText.classList.add('hidden');
    }

    async function saveBackup() {
      await fetch('/api/save-backup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          mtb: CURRENT_MTB,
          time: new Date().toLocaleString('vi-VN'),
          backupData: JSON.stringify(dbFiles)
        })
      });
    }

    function renderFiles() {
      const tbody = document.getElementById('fileTableBody');
      if (dbFiles.length === 0) {
        tbody.innerHTML = `<tr><td colspan="3" class="p-4 text-center text-slate-500">Chưa có tệp nào.</td></tr>`;
        return;
      }

      tbody.innerHTML = dbFiles.map(f => `
        <tr class="hover:bg-slate-700/30">
          <td class="p-3 font-semibold text-slate-200">📄 ${f.name}</td>
          <td class="p-3 text-xs text-slate-400">${(f.size / (1024*1024)).toFixed(2)} MB</td>
          <td class="p-3 text-right">
            <button onclick="downloadFile('${f.id}')" class="bg-emerald-600/20 text-emerald-300 border border-emerald-500/30 px-3 py-1 rounded text-xs font-semibold">⬇️ Tải Về</button>
          </td>
        </tr>
      `).join('');
    }

    async function downloadFile(id) {
      const item = dbFiles.find(f => f.id === id);
      if (!item) return;

      const blobs = [];
      for (let chunkId of item.chunks) {
        const res = await fetch(`/api/file-proxy?token=${BOT_TOKEN}&fileId=${chunkId}`);
        const blob = await res.blob();
        blobs.push(blob);
      }

      const fullBlob = new Blob(blobs, { type: 'application/octet-stream' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(fullBlob);
      link.download = item.name;
      link.click();
    }

    function logout() {
      localStorage.clear();
      location.reload();
    }
  </script>
</body>
</html>
