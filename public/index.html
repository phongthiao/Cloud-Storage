<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloud Storage System</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans antialiased relative overflow-x-hidden">

  <!-- OVERLAY KHI DRAG DROP -->
  <div id="dragOverlay" class="fixed inset-0 bg-indigo-900/80 backdrop-blur-md z-50 hidden flex flex-col items-center justify-center border-4 border-dashed border-indigo-400 m-4 rounded-3xl pointer-events-none">
    <div class="text-6xl mb-4 animate-bounce">📥</div>
    <div class="text-2xl font-bold text-white">Thả tệp vào đây để tải lên!</div>
  </div>

  <!-- CONTAINER CHÍNH -->
  <div class="max-w-7xl mx-auto p-4 sm:p-6 space-y-6">

    <!-- BAR THÔNG TIN TÀI KHOẢN & DUNG LƯỢNG -->
    <div class="bg-slate-800/80 border border-slate-700/60 backdrop-blur-md p-4 rounded-2xl shadow-xl flex flex-col md:flex-row justify-between items-center gap-4">
      <div class="flex items-center gap-3">
        <span class="text-2xl">☁️</span>
        <div>
          <div id="userInfoBadge" class="font-bold text-slate-200 text-sm">Thiết bị: Chưa xác định</div>
          <div class="text-xs text-slate-400 flex items-center gap-2 mt-0.5">
            <span id="storageUsageText">0 Bytes / 5 GB (0%)</span>
          </div>
        </div>
      </div>

      <!-- THANH DUNG LƯỢNG -->
      <div class="w-full md:w-64 space-y-1">
        <div class="w-full bg-slate-900 h-2 rounded-full overflow-hidden border border-slate-700">
          <div id="storageProgressBar" class="bg-indigo-500 h-full w-0 transition-all duration-300"></div>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button onclick="openBackupHistoryModal()" class="bg-purple-600/20 hover:bg-purple-600/30 text-purple-300 border border-purple-500/30 px-3 py-1.5 rounded-xl text-xs font-semibold transition">📜 Lịch sử lưu</button>
        <button onclick="exportBackupToFile()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-1.5 rounded-xl text-xs font-semibold transition">📥 Xuất JSON</button>
        <label class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-1.5 rounded-xl text-xs font-semibold cursor-pointer transition">
          📤 Nhập JSON
          <input type="file" accept=".json" onchange="importBackupFromFile(event)" class="hidden">
        </label>
        <button onclick="logout()" class="bg-rose-600/20 hover:bg-rose-600/30 text-rose-300 border border-rose-500/30 px-3 py-1.5 rounded-xl text-xs font-semibold transition">🚪 Đăng xuất</button>
      </div>
    </div>

    <!-- THANH CÔNG CỤ THAO TÁC -->
    <div class="bg-slate-800/80 border border-slate-700/60 backdrop-blur-md p-4 rounded-2xl shadow-xl space-y-4">
      <div class="flex flex-wrap items-center gap-3">
        <button onclick="createNewFolder()" class="bg-amber-600 hover:bg-amber-500 text-white font-semibold text-xs px-4 py-2.5 rounded-xl shadow-lg transition flex items-center gap-2">
          <span>➕</span> Tạo Thư Mục
        </button>

        <label class="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs px-4 py-2.5 rounded-xl shadow-lg cursor-pointer transition flex items-center gap-2">
          <span>📁</span> Chọn tệp
          <input id="fileInput" type="file" multiple onchange="handleFileSelect(event)" class="hidden">
        </label>

        <!-- TOOLBAR CHỌN NHIỀU FILE -->
        <div id="multiSelectActions" class="hidden flex items-center gap-2 pl-3 border-l border-slate-700">
          <button onclick="downloadSelectedItems()" class="bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-300 border border-emerald-500/30 px-3 py-1.5 rounded-xl text-xs font-semibold">📥 Tải mục chọn</button>
          <button onclick="openMoveModalForSelected()" class="bg-amber-600/20 hover:bg-amber-600/30 text-amber-300 border border-amber-500/30 px-3 py-1.5 rounded-xl text-xs font-semibold">🚚 Di chuyển</button>
          <button onclick="deleteSelectedItems()" class="bg-rose-600/20 hover:bg-rose-600/30 text-rose-300 border border-rose-500/30 px-3 py-1.5 rounded-xl text-xs font-semibold">🗑️ Xóa</button>
        </div>
      </div>

      <!-- THANH TIẾN TRÌNH UPLOAD (HỖ TRỢ HIỂN THỊ REALTIME) -->
      <div id="progressModal" class="hidden bg-slate-900 border border-indigo-500/30 p-4 rounded-xl space-y-2">
        <div class="flex justify-between items-center text-xs">
          <span id="statusText" class="text-indigo-300 font-medium truncate max-w-md">Đang xử lý tệp...</span>
          <span id="percentText" class="text-emerald-400 font-mono font-bold">0%</span>
        </div>
        <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden border border-slate-700">
          <div id="progressBar" class="bg-emerald-500 h-full w-0 transition-all duration-150"></div>
        </div>
      </div>
    </div>

    <!-- DANH SÁCH TỆP & THƯ MỤC -->
    <div class="bg-slate-800/80 border border-slate-700/60 backdrop-blur-md rounded-2xl shadow-xl overflow-hidden">
      <!-- BREADCRUMB & LỌC -->
      <div class="p-4 border-b border-slate-700/60 space-y-3">
        <div id="breadcrumbBar" class="text-sm text-slate-300 flex items-center gap-2 flex-wrap font-medium">
          <span class="font-bold text-indigo-400">🏠 Trang Chủ</span>
        </div>

        <div class="flex flex-col sm:flex-row gap-3 justify-between items-center">
          <div class="relative w-full sm:w-80">
            <input id="searchInput" type="text" oninput="applyFilters()" placeholder="🔍 Tìm kiếm tệp hoặc thư mục..." class="w-full bg-slate-900/80 border border-slate-700 rounded-xl px-3.5 py-2 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500">
          </div>
          <div class="flex items-center gap-2 w-full sm:w-auto">
            <select id="typeFilter" onchange="applyFilters()" class="bg-slate-900/80 border border-slate-700 text-slate-300 text-xs rounded-xl px-3 py-2 focus:outline-none">
              <option value="all">📁 Tất cả loại tệp</option>
              <option value="folder">📂 Thư mục</option>
              <option value="image">🖼️ Hình ảnh</option>
              <option value="video">🎥 Video</option>
              <option value="doc">📄 Tài liệu</option>
            </select>
            <select id="sortBy" onchange="applyFilters()" class="bg-slate-900/80 border border-slate-700 text-slate-300 text-xs rounded-xl px-3 py-2 focus:outline-none">
              <option value="name_asc">🔤 Tên (A-Z)</option>
              <option value="name_desc">🔤 Tên (Z-A)</option>
              <option value="date_desc">🕒 Mới nhất</option>
              <option value="date_asc">🕒 Cũ nhất</option>
              <option value="size_desc">⚖️ Dung lượng giảm</option>
              <option value="size_asc">⚖️ Dung lượng tăng</option>
            </select>
          </div>
        </div>
      </div>

      <!-- BẢNG TỆP -->
      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs">
          <thead class="bg-slate-900/50 text-slate-400 border-b border-slate-700/60 uppercase font-semibold">
            <tr>
              <th class="p-4 w-10 text-center">
                <input id="selectAllCheckbox" type="checkbox" onchange="toggleSelectAll(this)" class="w-4 h-4 rounded bg-slate-900 border-slate-700 accent-indigo-600">
              </th>
              <th class="p-4">TÊN TỆP / THƯ MỤC <span id="fileCountBadge" class="ml-1 bg-indigo-500/20 text-indigo-300 px-1.5 py-0.5 rounded-full text-[10px]">0</span> <span id="selectedCountText" class="hidden text-amber-400 font-normal"></span></th>
              <th class="p-4 w-28">DUNG LƯỢNG</th>
              <th class="p-4 w-36">NGÀY TẠO</th>
              <th class="p-4 w-60 text-right">THAO TÁC</th>
            </tr>
          </thead>
          <tbody id="fileTableBody" class="divide-y divide-slate-700/40">
            <tr><td colspan="5" class="p-6 text-center text-slate-500">Thư mục trống.</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- CONTAINER THÔNG BÁO TẢI FILE (TOAST) -->
  <div id="downloadToastContainer" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 w-80 pointer-events-none"></div>

  <!-- MODAL DĂNG NHẬP -->
  <div id="loginScreen" class="fixed inset-0 bg-slate-950 flex items-center justify-center p-4 z-50">
    <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl w-full max-w-sm space-y-4 shadow-2xl">
      <div class="text-center space-y-1">
        <div class="text-4xl">☁️</div>
        <h2 class="text-lg font-bold text-slate-100">Đăng Nhập Cloud Storage</h2>
      </div>
      <div class="space-y-3">
        <input id="inputMTB" type="text" placeholder="Nhập Mã Thiết Bị (MTB)" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2.5 text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500">
        <input id="inputMK" type="password" placeholder="Nhập Mật Khẩu" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2.5 text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500">
        <button onclick="loginWithCloud()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs py-2.5 rounded-xl transition">Đăng Nhập</button>
      </div>
      <div id="loginStatus" class="hidden text-xs text-center font-medium"></div>
    </div>
  </div>

  <!-- MODAL XEM TRƯỚC -->
  <div id="previewModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex flex-col items-center justify-center p-4">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-4xl max-h-[90vh] flex flex-col overflow-hidden shadow-2xl">
      <div class="p-4 border-b border-slate-700 flex justify-between items-center bg-slate-900/50">
        <h3 id="previewTitle" class="text-xs font-bold text-indigo-300 truncate">Xem trước</h3>
        <button onclick="closePreviewModal()" class="text-slate-400 hover:text-white font-bold text-sm px-2 py-1">✕</button>
      </div>
      <div id="previewBody" class="p-4 flex-1 flex items-center justify-center overflow-auto bg-slate-950"></div>
    </div>
  </div>

  <!-- MODAL DI CHUYỂN -->
  <div id="moveModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-800 border border-slate-700 p-5 rounded-2xl w-full max-w-sm space-y-4 shadow-2xl">
      <h3 class="text-xs font-bold text-slate-200">🚚 Di chuyển mục tới:</h3>
      <select id="targetFolderSelect" class="w-full bg-slate-900 border border-slate-700 text-slate-300 text-xs rounded-xl p-2.5 focus:outline-none"></select>
      <div class="flex justify-end gap-2">
        <button onclick="closeMoveModal()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs px-3 py-1.5 rounded-xl">Hủy</button>
        <button onclick="executeMoveItems()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs px-3 py-1.5 rounded-xl font-semibold">Xác nhận</button>
      </div>
    </div>
  </div>

  <!-- MODAL LỊCH SỬ SAO LƯU SHEET -->
  <div id="backupModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-800 border border-slate-700 p-5 rounded-2xl w-full max-w-md space-y-4 shadow-2xl">
      <div class="flex justify-between items-center border-b border-slate-700 pb-3">
        <h3 class="text-xs font-bold text-purple-300">📜 Bản Sao Lưu Google Sheets</h3>
        <button onclick="closeBackupModal()" class="text-slate-400 hover:text-white font-bold text-sm">✕</button>
      </div>
      <div id="backupListContainer" class="space-y-3 max-h-80 overflow-y-auto pr-1"></div>
    </div>
  </div>

  <!-- JS CHÍNH VÀ CÁC CẢI TIẾN REALTIME -->
  <script>
    let CURRENT_MTB = localStorage.getItem('cur_mtb') || null;
    let MAX_STORAGE_GB = localStorage.getItem('cur_max_gb') ? parseFloat(localStorage.getItem('cur_max_gb')) : 5;
    let SESSION_TOKEN = localStorage.getItem('session_token') || null;

    let dbFiles = [];
    let currentFolderId = null;
    let selectedFileIds = new Set();
    let moveTargetItemIds = [];
    let activePreviewObjectUrl = null;

    const CHUNK_SIZE = 10 * 1024 * 1024; // Chunk 10MB

    window.onload = async () => {
      setupDragAndDrop();
      if (CURRENT_MTB && SESSION_TOKEN) {
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('userInfoBadge').innerText = `Thiết bị: ${CURRENT_MTB}`;
        await autoFetchLatestBackupOnStart();
      }
    };

    function setupDragAndDrop() {
      const dragOverlay = document.getElementById('dragOverlay');
      window.addEventListener('dragover', (e) => { e.preventDefault(); dragOverlay.classList.remove('hidden'); });
      window.addEventListener('dragleave', (e) => {
        if (e.clientX <= 0 || e.clientY <= 0 || e.clientX >= window.innerWidth || e.clientY >= window.innerHeight) {
          dragOverlay.classList.add('hidden');
        }
      });
      window.addEventListener('drop', (e) => {
        e.preventDefault();
        dragOverlay.classList.add('hidden');
        if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
          startBatchUploadQueue(Array.from(e.dataTransfer.files));
        }
      });
    }

    async function loginWithCloud() {
      const mtb = document.getElementById('inputMTB').value.trim().toUpperCase();
      const mk = document.getElementById('inputMK').value.trim();
      const statusDiv = document.getElementById('loginStatus');

      if (!mtb || !mk) return alert("Vui lòng nhập MTB và Mật khẩu!");

      statusDiv.className = "text-xs text-center font-medium text-amber-400";
      statusDiv.innerText = "⏳ Đang xác thực...";
      statusDiv.classList.remove('hidden');

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ mtb: mtb, mk: mk })
        });
        const data = await res.json();

        if (data.success) {
          CURRENT_MTB = data.mtb;
          MAX_STORAGE_GB = data.maxGb || 5;
          SESSION_TOKEN = data.sessionToken;

          localStorage.setItem('cur_mtb', CURRENT_MTB);
          localStorage.setItem('cur_max_gb', MAX_STORAGE_GB);
          localStorage.setItem('session_token', SESSION_TOKEN);

          document.getElementById('loginScreen').classList.add('hidden');
          document.getElementById('userInfoBadge').innerText = `Thiết bị: ${CURRENT_MTB}`;
          await autoFetchLatestBackupOnStart();
        } else {
          statusDiv.className = "text-xs text-center font-medium text-rose-400";
          statusDiv.innerText = "❌ " + (data.message || "Đăng nhập thất bại!");
        }
      } catch (err) {
        statusDiv.className = "text-xs text-center font-medium text-rose-400";
        statusDiv.innerText = "❌ Lỗi kết nối Server!";
      }
    }

    async function autoFetchLatestBackupOnStart() {
      if (!CURRENT_MTB) return;
      try {
        const res = await fetch(`/api/backup?mtb=${encodeURIComponent(CURRENT_MTB)}`);
        const listData = await res.json();

        if (Array.isArray(listData) && listData.length > 0) {
          const latestBackup = listData[listData.length - 1];
          if (latestBackup.backupData) {
            dbFiles = typeof latestBackup.backupData === 'string' 
              ? JSON.parse(latestBackup.backupData) 
              : latestBackup.backupData;
          }
        }
      } catch (e) {
        console.error("Lỗi đọc dữ liệu:", e);
      } finally {
        renderBreadcrumb();
        applyFilters();
        updateStorageUsage();
      }
    }

    async function manualBackupToSheet() {
      if (!CURRENT_MTB) return;
      const timeStr = new Date().toLocaleString('vi-VN');
      try {
        await fetch('/api/save-backup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            mtb: CURRENT_MTB,
            time: timeStr,
            backupData: JSON.stringify(dbFiles)
          })
        });
      } catch (err) {
        console.error("Lỗi sao lưu ngầm!", err);
      }
    }

    function exportBackupToFile() {
      if (!dbFiles || dbFiles.length === 0) return alert("Chưa có dữ liệu!");
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(dbFiles, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `backup_${CURRENT_MTB}_${new Date().toISOString().slice(0, 10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function importBackupFromFile(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = async function(e) {
        try {
          const importedData = JSON.parse(e.target.result);
          if (Array.isArray(importedData)) {
            if (confirm(`Khôi phục bản sao lưu (${importedData.length} mục)?`)) {
              dbFiles = importedData;
              renderBreadcrumb();
              applyFilters();
              updateStorageUsage();
              await manualBackupToSheet();
              alert("🎉 Khôi phục thành công!");
            }
          }
        } catch (err) {
          alert("❌ Tệp không hợp lệ!");
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    function handleFileSelect(e) {
      const files = Array.from(e.target.files);
      if (files.length > 0) startBatchUploadQueue(files);
    }

    // =========================================================
    // HÀM UPLOAD - ĐÃ ĐƯỢC TỐI ƯU SẮP XẾP VÀ CẬP NHẬT GIAO DIỆN REALTIME
    // =========================================================
    async function startBatchUploadQueue(files) {
      if (!files || files.length === 0) return;

      // 1. Sắp xếp file theo dung lượng tăng dần (tải file nhẹ trước)
      const sortedFiles = Array.from(files).sort((a, b) => a.size - b.size);

      const progressModal = document.getElementById('progressModal');
      const progressBar = document.getElementById('progressBar');
      const percentText = document.getElementById('percentText');
      const statusText = document.getElementById('statusText');

      if (progressModal) progressModal.classList.remove('hidden');

      for (let i = 0; i < sortedFiles.length; i++) {
        const file = sortedFiles[i];
        const totalChunks = Math.ceil(file.size / CHUNK_SIZE);
        const chunkIds = [];
        let isFileError = false;

        for (let c = 0; c < totalChunks; c++) {
          const start = c * CHUNK_SIZE;
          const end = Math.min(file.size, start + CHUNK_SIZE);
          const chunkBlob = file.slice(start, end);

          const percent = Math.round(((c + 1) / totalChunks) * 100);
          if (statusText) {
            statusText.innerText = `📦 [${i + 1}/${sortedFiles.length}] Uploading: ${file.name} (${formatBytes(file.size)}) - Mảnh ${c + 1}/${totalChunks}`;
          }
          if (progressBar) progressBar.style.width = `${percent}%`;
          if (percentText) percentText.innerText = `${percent}%`;

          const formData = new FormData();
          formData.append('document', chunkBlob, `${file.name}.part${c}`);

          let uploadSuccess = false;
          for (let retry = 0; retry < 3; retry++) {
            try {
              const res = await fetch('/api/upload-chunk', { 
                method: 'POST', 
                headers: { 'Authorization': `Bearer ${SESSION_TOKEN}` },
                body: formData 
              });
              const data = await res.json();
              if (data.success) {
                chunkIds.push(data.file_id);
                uploadSuccess = true;
                break;
              }
            } catch (err) {}
            await new Promise(r => setTimeout(r, 1000));
          }

          if (!uploadSuccess) {
            alert(`❌ Lỗi Upload tệp: ${file.name}`);
            isFileError = true;
            break;
          }
        }

        // TỆP NÀO TẢI XONG -> ĐẨY XUỐNG BẢNG & BACKUP TỨC THÌ
        if (!isFileError && chunkIds.length === totalChunks) {
          const newFileItem = {
            id: "file_" + Date.now() + "_" + Math.random().toString(36).substr(2, 4),
            name: file.name,
            size: file.size,
            chunks: chunkIds,
            isFolder: false,
            parentId: currentFolderId, // Thư mục hiện tại
            date: new Date().toLocaleString('vi-VN'),
            timestamp: Date.now()
          };

          // 1. Đẩy vào danh sách
          dbFiles.unshift(newFileItem);

          // 2. Ép giao diện vẽ lại ngay lập tức
          applyFilters();
          updateStorageUsage();

          // 3. Tự động lưu lên Sheet ngầm
          manualBackupToSheet();
        }
      }

      const fileInput = document.getElementById('fileInput');
      if (fileInput) fileInput.value = '';
      if (progressModal) progressModal.classList.add('hidden');
    }

    // TẢI FILE NỐI MẢNH TỐC ĐỘ CAO (4 LUỒNG SONG SONG)
    async function fetchChunksOptimized(chunks, filename, progressCallback) {
      const results = new Array(chunks.length);
      const CONCURRENCY = 4;
      let completedCount = 0;

      const fetchSingleChunk = async (index) => {
        const chunkId = chunks[index];
        const proxyUrl = `/api/file-proxy?fileId=${encodeURIComponent(chunkId)}&filename=${encodeURIComponent(filename)}`;
        
        let downloadedBlob = null;
        for (let attempt = 1; attempt <= 3; attempt++) {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 12000);

          try {
            const res = await fetch(proxyUrl, {
              headers: { 'Authorization': `Bearer ${SESSION_TOKEN}` },
              signal: controller.signal
            });
            clearTimeout(timeoutId);

            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            downloadedBlob = await res.blob();
            break; 
          } catch (err) {
            clearTimeout(timeoutId);
            await new Promise(r => setTimeout(r, 800 * attempt));
          }
        }

        if (!downloadedBlob) throw new Error(`Nghẽn kết nối mảnh #${index + 1}`);

        results[index] = downloadedBlob;
        completedCount++;
        if (progressCallback) progressCallback(completedCount, chunks.length);
      };

      for (let i = 0; i < chunks.length; i += CONCURRENCY) {
        const batch = [];
        for (let j = i; j < i + CONCURRENCY && j < chunks.length; j++) {
          batch.push(fetchSingleChunk(j));
        }
        await Promise.all(batch);
      }

      return results;
    }

    function getFileExtension(filename) {
      return filename ? filename.split('.').pop().toLowerCase() : '';
    }

    function getMimeType(filename) {
      const ext = getFileExtension(filename);
      const mimeTypes = {
        'mp4': 'video/mp4', 'webm': 'video/webm', 'mkv': 'video/x-matroska',
        'mp3': 'audio/mpeg', 'wav': 'audio/wav', 'ogg': 'audio/ogg',
        'jpg': 'image/jpeg', 'jpeg': 'image/jpeg', 'png': 'image/png', 'gif': 'image/gif', 'webp': 'image/webp',
        'pdf': 'application/pdf', 'txt': 'text/plain; charset=utf-8', 'json': 'application/json; charset=utf-8'
      };
      return mimeTypes[ext] || 'application/octet-stream';
    }

    async function downloadSingleFile(id) {
      const item = dbFiles.find(f => f.id === id);
      if (!item || item.isFolder) return;

      const toastId = "toast_" + Date.now();
      showToastNotification(toastId, item.name);

      try {
        if (item.chunks.length === 1) {
          updateToastProgress(toastId, 1, 1);
          const directUrl = `/api/file-proxy?fileId=${encodeURIComponent(item.chunks[0])}&filename=${encodeURIComponent(item.name)}`;
          
          const a = document.createElement('a');
          a.href = directUrl;
          a.download = item.name;
          a.style.display = 'none';
          document.body.appendChild(a);
          a.click();
          
          setTimeout(() => a.remove(), 1000);
          finishToastNotification(toastId, true);
          return;
        }

        const blobParts = await fetchChunksOptimized(item.chunks, item.name, (current, total) => {
          updateToastProgress(toastId, current, total);
        });

        const fileMime = getMimeType(item.name);
        const fullBlob = new Blob(blobParts, { type: fileMime });

        for (let i = 0; i < blobParts.length; i++) {
          blobParts[i] = null;
        }

        const objectUrl = URL.createObjectURL(fullBlob);

        const a = document.createElement('a');
        a.href = objectUrl;
        a.download = item.name;
        a.style.display = 'none';
        document.body.appendChild(a);
        a.click();

        setTimeout(() => {
          a.remove();
          URL.revokeObjectURL(objectUrl);
        }, 800);

        finishToastNotification(toastId, true);

      } catch (err) {
        finishToastNotification(toastId, false, err.message);
      }
    }

    function showToastNotification(id, filename) {
      const container = document.getElementById('downloadToastContainer');
      const toast = document.createElement('div');
      toast.id = id;
      toast.className = "bg-slate-800 border border-indigo-500/40 p-3 rounded-xl shadow-2xl pointer-events-auto space-y-2 transition-all duration-300";
      toast.innerHTML = `
        <div class="flex items-center justify-between gap-2">
          <span class="text-xs font-semibold text-indigo-300 truncate max-w-[200px]">📥 ${escapeHtml(filename)}</span>
          <span class="text-[10px] text-emerald-400 font-mono font-bold toast-percent">0%</span>
        </div>
        <div class="w-full bg-slate-900 h-1.5 rounded-full overflow-hidden border border-slate-700">
          <div class="bg-indigo-500 h-full w-0 transition-all duration-150 toast-bar"></div>
        </div>
      `;
      container.appendChild(toast);
    }

    function updateToastProgress(id, current, total) {
      const toast = document.getElementById(id);
      if (!toast) return;
      const percent = Math.round((current / total) * 100);
      toast.querySelector('.toast-percent').innerText = `${percent}%`;
      toast.querySelector('.toast-bar').style.width = `${percent}%`;
    }

    function finishToastNotification(id, success, errorMsg = "") {
      const toast = document.getElementById(id);
      if (!toast) return;

      if (success) {
        toast.className = "bg-emerald-950/80 border border-emerald-500/40 p-3 rounded-xl shadow-2xl pointer-events-auto transition-all duration-300";
        toast.innerHTML = `<div class="text-xs font-semibold text-emerald-300">✅ Đã tải xong & giải phóng RAM!</div>`;
      } else {
        toast.className = "bg-rose-950/80 border border-rose-500/40 p-3 rounded-xl shadow-2xl pointer-events-auto transition-all duration-300";
        toast.innerHTML = `<div class="text-xs font-semibold text-rose-300">❌ Lỗi: ${escapeHtml(errorMsg)}</div>`;
      }

      setTimeout(() => {
        toast.style.opacity = '0';
        setTimeout(() => toast.remove(), 300);
      }, 2500);
    }

    async function previewFile(id) {
      const item = dbFiles.find(f => f.id === id);
      if (!item || item.isFolder) return;

      closePreviewModal();

      const modal = document.getElementById('previewModal');
      const title = document.getElementById('previewTitle');
      const body = document.getElementById('previewBody');

      modal.classList.remove('hidden');
      title.innerText = `🎬 Xem trước: ${item.name}`;

      const ext = getFileExtension(item.name);
      if (['mp4', 'webm', 'mkv', 'mov'].includes(ext) && item.chunks.length === 1) {
        const streamUrl = `/api/file-proxy?fileId=${encodeURIComponent(item.chunks[0])}&filename=${encodeURIComponent(item.name)}`;
        body.innerHTML = `
          <video controls autoplay playsinline class="max-h-[75vh] w-full rounded-xl shadow-2xl bg-black">
            <source src="${streamUrl}" type="${getMimeType(item.name)}">
            Trình duyệt không hỗ trợ phát Video.
          </video>`;
        return;
      }

      const updateStatus = (current, total) => {
        body.innerHTML = `
          <div class="text-center space-y-3">
            <div class="text-4xl animate-bounce">⏳</div>
            <p class="text-indigo-400 text-sm font-semibold">Đang chuẩn bị luồng dữ liệu...</p>
            <p class="text-xs text-emerald-400 font-mono font-bold">Mảnh: ${current} / ${total}</p>
          </div>`;
      };

      try {
        const blobParts = await fetchChunksOptimized(item.chunks, item.name, updateStatus);
        const fileMime = getMimeType(item.name);
        const fullBlob = new Blob(blobParts, { type: fileMime });

        for (let i = 0; i < blobParts.length; i++) {
          blobParts[i] = null;
        }

        activePreviewObjectUrl = URL.createObjectURL(fullBlob);

        if (['mp4', 'webm', 'mkv', 'mov'].includes(ext)) {
          body.innerHTML = `
            <video controls autoplay playsinline class="max-h-[75vh] w-full rounded-xl shadow-2xl bg-black">
              <source src="${activePreviewObjectUrl}" type="${fileMime}">
            </video>`;
        } else if (['jpg', 'jpeg', 'png', 'gif', 'webp'].includes(ext)) {
          body.innerHTML = `<img src="${activePreviewObjectUrl}" class="max-h-[75vh] max-w-full rounded-lg object-contain">`;
        } else if (['mp3', 'wav', 'ogg'].includes(ext)) {
          body.innerHTML = `<audio src="${activePreviewObjectUrl}" controls autoplay class="w-full max-w-md mx-auto"></audio>`;
        } else if (ext === 'pdf') {
          body.innerHTML = `<iframe src="${activePreviewObjectUrl}" class="w-full h-[75vh] rounded-lg"></iframe>`;
        } else if (['txt', 'json', 'html', 'js', 'css', 'md'].includes(ext)) {
          const textRes = await fetch(activePreviewObjectUrl);
          const textContent = await textRes.text();
          body.innerHTML = `<pre class="bg-slate-900 p-4 rounded-lg text-xs text-slate-200 overflow-auto max-h-[75vh] w-full font-mono select-text">${escapeHtml(textContent)}</pre>`;
        } else {
          body.innerHTML = `
            <div class="text-center space-y-3 p-6">
              <div class="text-4xl">📦</div>
              <p class="text-slate-300 text-sm">Định dạng không hỗ trợ xem trực tuyến.</p>
              <button onclick="downloadSingleFile('${item.id}')" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs px-4 py-2.5 rounded-xl font-semibold">
                📥 Tải tệp về máy
              </button>
            </div>`;
        }
      } catch (err) {
        body.innerHTML = `<div class="text-center text-rose-400 text-sm p-6">❌ Lỗi tải xem trước: ${err.message}</div>`;
      }
    }

    function closePreviewModal() {
      const body = document.getElementById('previewBody');
      const videoElem = body.querySelector('video');
      if (videoElem) {
        videoElem.pause();
        videoElem.src = "";
      }
      body.innerHTML = "";

      if (activePreviewObjectUrl) {
        URL.revokeObjectURL(activePreviewObjectUrl);
        activePreviewObjectUrl = null;
      }

      document.getElementById('previewModal').classList.add('hidden');
    }

    async function downloadSelectedItems() {
      const itemsToDownload = dbFiles.filter(f => selectedFileIds.has(f.id) && !f.isFolder);
      if (itemsToDownload.length === 0) return alert("Chưa chọn tệp!");

      for (let i = 0; i < itemsToDownload.length; i++) {
        await downloadSingleFile(itemsToDownload[i].id);
        await new Promise(resolve => setTimeout(resolve, 400));
      }
    }

    function renameItem(id) {
      const item = dbFiles.find(f => f.id === id);
      if (!item) return;

      const newName = prompt("Nhập tên mới:", item.name);
      if (newName && newName.trim() && newName.trim() !== item.name) {
        item.name = newName.trim();
        applyFilters();
        manualBackupToSheet();
      }
    }

    function openMoveModal(id) {
      moveTargetItemIds = [id];
      renderFolderOptions();
      document.getElementById('moveModal').classList.remove('hidden');
    }

    function openMoveModalForSelected() {
      if (selectedFileIds.size === 0) return;
      moveTargetItemIds = Array.from(selectedFileIds);
      renderFolderOptions();
      document.getElementById('moveModal').classList.remove('hidden');
    }

    function renderFolderOptions() {
      const select = document.getElementById('targetFolderSelect');
      const folders = dbFiles.filter(f => f.isFolder && !moveTargetItemIds.includes(f.id));

      select.innerHTML = `<option value="null">🏠 Trang Chủ (Root)</option>` +
        folders.map(f => `<option value="${f.id}">📁 ${escapeHtml(f.name)}</option>`).join('');
    }

    function closeMoveModal() {
      document.getElementById('moveModal').classList.add('hidden');
      moveTargetItemIds = [];
    }

    function executeMoveItems() {
      const targetVal = document.getElementById('targetFolderSelect').value;
      const targetFolderId = targetVal === 'null' ? null : targetVal;

      dbFiles.forEach(item => {
        if (moveTargetItemIds.includes(item.id)) {
          item.parentId = targetFolderId;
        }
      });

      selectedFileIds.clear();
      updateMultiSelectToolbar();
      closeMoveModal();
      applyFilters();
      manualBackupToSheet();
    }

    function applyFilters() {
      const searchQuery = document.getElementById('searchInput').value.trim().toLowerCase();
      const typeFilter = document.getElementById('typeFilter').value;
      const sortBy = document.getElementById('sortBy').value;

      let items = getCurrentFolderItems();

      if (searchQuery) {
        items = items.filter(f => f.name.toLowerCase().includes(searchQuery));
      }

      if (typeFilter !== 'all') {
        items = items.filter(f => {
          if (typeFilter === 'folder') return f.isFolder;
          if (f.isFolder) return false;

          const ext = getFileExtension(f.name);
          if (typeFilter === 'image') return ['jpg', 'jpeg', 'png', 'gif', 'webp'].includes(ext);
          if (typeFilter === 'video') return ['mp4', 'webm', 'mkv', 'mov'].includes(ext);
          if (typeFilter === 'doc') return ['pdf', 'txt', 'doc', 'docx', 'xls', 'xlsx', 'json', 'js', 'html', 'cpp'].includes(ext);
          return true;
        });
      }

      items.sort((a, b) => {
        if (a.isFolder && !b.isFolder) return -1;
        if (!a.isFolder && b.isFolder) return 1;

        if (sortBy === 'name_asc') return a.name.localeCompare(b.name);
        if (sortBy === 'name_desc') return b.name.localeCompare(a.name);
        if (sortBy === 'size_desc') return (b.size || 0) - (a.size || 0);
        if (sortBy === 'size_asc') return (a.size || 0) - (b.size || 0);
        if (sortBy === 'date_desc') return (b.timestamp || 0) - (a.timestamp || 0);
        if (sortBy === 'date_asc') return (a.timestamp || 0) - (b.timestamp || 0);
        return 0;
      });

      renderFiles(items);
    }

    function toggleSelectAll(masterCheckbox) {
      const currentItems = getCurrentFolderItems();
      selectedFileIds.clear();

      if (masterCheckbox.checked) {
        currentItems.forEach(item => selectedFileIds.add(item.id));
      }

      applyFilters();
      updateMultiSelectToolbar();
    }

    function toggleSelectItem(id) {
      if (selectedFileIds.has(id)) {
        selectedFileIds.delete(id);
      } else {
        selectedFileIds.add(id);
      }
      updateMultiSelectToolbar();
    }

    function updateMultiSelectToolbar() {
      const count = selectedFileIds.size;
      const toolbar = document.getElementById('multiSelectActions');
      const countText = document.getElementById('selectedCountText');

      if (count > 0) {
        toolbar.classList.remove('hidden');
        countText.classList.remove('hidden');
        countText.innerText = `(Đã chọn: ${count})`;
      } else {
        toolbar.classList.add('hidden');
        countText.classList.add('hidden');
        document.getElementById('selectAllCheckbox').checked = false;
      }
    }

    function getRecursiveIdsToDelete(itemIds) {
      let idsToDelete = new Set(itemIds);
      let addedMore = true;

      while (addedMore) {
        addedMore = false;
        dbFiles.forEach(item => {
          if (item.parentId && idsToDelete.has(item.parentId) && !idsToDelete.has(item.id)) {
            idsToDelete.add(item.id);
            addedMore = true;
          }
        });
      }
      return idsToDelete;
    }

    function deleteSelectedItems() {
      if (selectedFileIds.size === 0) return;
      if (confirm(`Xóa ${selectedFileIds.size} mục đã chọn?`)) {
        const allIdsToDelete = getRecursiveIdsToDelete(Array.from(selectedFileIds));
        dbFiles = dbFiles.filter(item => !allIdsToDelete.has(item.id));
        selectedFileIds.clear();
        updateMultiSelectToolbar();
        applyFilters();
        updateStorageUsage();
        manualBackupToSheet();
      }
    }

    function deleteSingleItem(id) {
      if (confirm("Xóa mục này?")) {
        const allIdsToDelete = getRecursiveIdsToDelete([id]);
        dbFiles = dbFiles.filter(f => !allIdsToDelete.has(f.id));
        selectedFileIds.delete(id);
        applyFilters();
        updateStorageUsage();
        manualBackupToSheet();
      }
    }

    function createNewFolder() {
      const folderName = prompt("Nhập tên thư mục:");
      if (!folderName || !folderName.trim()) return;

      dbFiles.unshift({
        id: "folder_" + Date.now(),
        name: folderName.trim(),
        isFolder: true,
        parentId: currentFolderId,
        date: new Date().toLocaleString('vi-VN'),
        timestamp: Date.now()
      });

      applyFilters();
      manualBackupToSheet();
    }

    function getCurrentFolderItems() {
      return dbFiles.filter(item => (item.parentId || null) === currentFolderId);
    }

    function openFolder(folderId) {
      currentFolderId = folderId;
      selectedFileIds.clear();
      updateMultiSelectToolbar();
      renderBreadcrumb();
      applyFilters();
    }

    function renderBreadcrumb() {
      const breadcrumbBar = document.getElementById('breadcrumbBar');
      let path = [{ id: null, name: "🏠 Trang Chủ" }];
      let curr = currentFolderId;
      let tempStack = [];

      while (curr) {
        const found = dbFiles.find(item => item.id === curr);
        if (found) {
          tempStack.unshift({ id: found.id, name: found.name });
          curr = found.parentId;
        } else break;
      }

      path = path.concat(tempStack);
      breadcrumbBar.innerHTML = path.map((node, index) => {
        return index === path.length - 1
          ? `<span class="font-bold text-indigo-400">${escapeHtml(node.name)}</span>`
          : `<button onclick="openFolder(${node.id ? `'${node.id}'` : 'null'})" class="hover:text-indigo-300 font-medium">${escapeHtml(node.name)}</button> <span class="text-slate-500">/</span>`;
      }).join(' ');
    }

    function renderFiles(items) {
      const tbody = document.getElementById('fileTableBody');
      document.getElementById('fileCountBadge').innerText = items.length;

      if (items.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-slate-500">Thư mục trống.</td></tr>`;
        return;
      }

      tbody.innerHTML = items.map(item => {
        const isChecked = selectedFileIds.has(item.id) ? 'checked' : '';
        return `
          <tr class="hover:bg-slate-700/30 transition">
            <td class="p-4 text-center">
              <input type="checkbox" onchange="toggleSelectItem('${item.id}')" ${isChecked} class="w-4 h-4 rounded bg-slate-900 border-slate-700 accent-indigo-600 cursor-pointer">
            </td>
            <td class="p-4 font-semibold text-slate-200 flex items-center gap-2">
              <span>${item.isFolder ? '📁' : '📄'}</span>
              <span class="truncate max-w-xs sm:max-w-md">${escapeHtml(item.name)}</span>
            </td>
            <td class="p-4 text-slate-400 text-xs">${item.isFolder ? '--' : formatBytes(item.size)}</td>
            <td class="p-4 text-slate-400 text-xs">${item.date || '--'}</td>
            <td class="p-4 text-right space-x-1">
              ${item.isFolder 
                ? `<button onclick="openFolder('${item.id}')" class="bg-amber-600/20 hover:bg-amber-600/40 text-amber-300 border border-amber-500/30 px-2 py-1 rounded-lg text-xs font-semibold">📂 Mở</button>`
                : `<button onclick="previewFile('${item.id}')" class="bg-indigo-600/20 hover:bg-indigo-600/40 text-indigo-300 border border-indigo-500/30 px-2 py-1 rounded-lg text-xs font-semibold">👁️ Xem</button>
                   <button onclick="downloadSingleFile('${item.id}')" class="bg-emerald-600/20 hover:bg-emerald-600/40 text-emerald-300 border border-emerald-500/30 px-2 py-1 rounded-lg text-xs font-semibold">📥 Tải</button>`
              }
              <button onclick="renameItem('${item.id}')" class="bg-blue-600/20 hover:bg-blue-600/40 text-blue-300 border border-blue-500/30 px-2 py-1 rounded-lg text-xs font-semibold">✏️ Đổi tên</button>
              <button onclick="openMoveModal('${item.id}')" class="bg-amber-600/20 hover:bg-amber-500/40 text-amber-300 border border-amber-500/30 px-2 py-1 rounded-lg text-xs font-semibold">🚚 Di chuyển</button>
              <button onclick="deleteSingleItem('${item.id}')" class="bg-rose-600/20 hover:bg-rose-600/40 text-rose-300 border border-rose-500/30 px-2 py-1 rounded-lg text-xs font-semibold">🗑️</button>
            </td>
          </tr>`;
      }).join('');
    }

    async function openBackupHistoryModal() {
      const modal = document.getElementById('backupModal');
      const container = document.getElementById('backupListContainer');
      modal.classList.remove('hidden');
      container.innerHTML = `<div class="text-center py-6 text-amber-400 text-xs">⏳ Đang đọc sao lưu...</div>`;

      try {
        const res = await fetch(`/api/backup?mtb=${encodeURIComponent(CURRENT_MTB)}`);
        const listData = await res.json();

        if (!Array.isArray(listData) || listData.length === 0) {
          container.innerHTML = `<div class="text-center py-6 text-slate-500 text-xs">Chưa có bản sao lưu nào.</div>`;
          return;
        }

        const recentBackups = listData.slice(-5).reverse();

        container.innerHTML = recentBackups.map((item, index) => {
          const encodedData = encodeURIComponent(item.backupData);
          return `
            <div class="bg-slate-900 border border-purple-500/30 p-3.5 rounded-xl space-y-2.5">
              <div class="flex items-center justify-between">
                <div class="text-xs font-bold text-slate-100">🕒 Bản lưu #${recentBackups.length - index}: ${item.time}</div>
              </div>
              <div class="flex justify-end pt-1">
                <button onclick="applyBackupFromCloud('${encodedData}')" class="bg-purple-600 hover:bg-purple-500 text-white text-xs px-3 py-1.5 rounded-lg font-semibold transition">
                  📥 Khôi Phục
                </button>
              </div>
            </div>`;
        }).join('');

      } catch (err) {
        container.innerHTML = `<div class="text-center py-6 text-rose-400 text-xs">❌ Lỗi đọc bảng sao lưu!</div>`;
      }
    }

    function closeBackupModal() {
      document.getElementById('backupModal').classList.add('hidden');
    }

    async function applyBackupFromCloud(encodedJsonData) {
      try {
        const jsonStr = decodeURIComponent(encodedJsonData);
        const importedData = JSON.parse(jsonStr);

        if (Array.isArray(importedData)) {
          if (confirm(`Khôi phục ${importedData.length} mục?`)) {
            dbFiles = importedData;
            renderBreadcrumb();
            applyFilters();
            updateStorageUsage();
            closeBackupModal();
            alert("🎉 Khôi phục thành công!");
          }
        }
      } catch (e) {
        alert("❌ Bản sao lưu không hợp lệ!");
      }
    }

    function updateStorageUsage() {
      const maxBytes = MAX_STORAGE_GB * 1024 * 1024 * 1024;
      const totalBytes = dbFiles.reduce((sum, item) => sum + (item.size || 0), 0);
      const usedPercentage = Math.min(100, ((totalBytes / maxBytes) * 100).toFixed(1));
      
      document.getElementById('storageUsageText').innerText = `${formatBytes(totalBytes)} / ${MAX_STORAGE_GB} GB (${usedPercentage}%)`;
      document.getElementById('storageProgressBar').style.width = `${usedPercentage}%`;
    }

    function logout() {
      localStorage.clear();
      location.reload();
    }

    function escapeHtml(text) {
      return String(text || '').replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
      });
    }

    function formatBytes(bytes) {
      if (!bytes || bytes === 0) return '0 Bytes';
      const k = 1024;
      const sizes = ['Bytes', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }
  </script>
