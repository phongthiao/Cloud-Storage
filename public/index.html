<script>
  const AUTH_API_URL = "/api/login";
  const BACKUP_SCRIPT_URL = "/api/backup";

  const CHUNK_SIZE = 10 * 1024 * 1024; // Cố định 10MB mỗi mảnh

  let CURRENT_MTB = localStorage.getItem('cur_mtb') || null;
  let BOT_TOKEN = localStorage.getItem('cur_token') || null;
  let CHAT_ID = localStorage.getItem('cur_chatid') || null;
  let MAX_STORAGE_GB = localStorage.getItem('cur_max_gb') ? parseFloat(localStorage.getItem('cur_max_gb')) : null;
  let PINNED_MSG_ID = localStorage.getItem('cur_msg_id') || null;

  let dbFiles = [];
  let currentFolderId = null;

  let isUploading = false;
  let isPaused = false;
  let isCancelled = false;
  let currentXHR = null;

  const previewCache = new Map();

  window.onload = async () => {
    if (CURRENT_MTB && BOT_TOKEN && CHAT_ID) {
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('userInfoBadge').innerText = `Thiết bị: ${CURRENT_MTB}`;
      await autoFetchLatestBackupOnStart();
    }
  };

  async function loginWithCloud() {
    const mtb = document.getElementById('inputMTB').value.trim().toUpperCase();
    const mk = document.getElementById('inputMK').value.trim();
    const statusDiv = document.getElementById('loginStatus');
    const loginBtn = document.getElementById('loginBtn');

    if (!mtb || !mk) return alert("Vui lòng nhập đầy đủ Mã Thiết Bị và Mật Khẩu!");

    statusDiv.className = "text-xs text-center font-medium text-amber-400";
    statusDiv.innerText = "⏳ Đang xác thực thông tin...";
    statusDiv.classList.remove('hidden');
    loginBtn.disabled = true;

    try {
      const response = await fetch(AUTH_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mtb: mtb, mk: mk })
      });
      
      const resData = await response.json();

      if (resData.success) {
        CURRENT_MTB = mtb;
        BOT_TOKEN = resData.token;
        CHAT_ID = resData.chatId;
        MAX_STORAGE_GB = resData.maxGb || null;

        localStorage.setItem('cur_mtb', CURRENT_MTB);
        localStorage.setItem('cur_token', BOT_TOKEN);
        localStorage.setItem('cur_chatid', CHAT_ID);
        if (MAX_STORAGE_GB !== null) {
          localStorage.setItem('cur_max_gb', MAX_STORAGE_GB);
        }

        statusDiv.className = "text-xs text-center font-medium text-emerald-400";
        statusDiv.innerText = "✅ Đăng nhập thành công!";

        setTimeout(async () => {
          document.getElementById('loginScreen').classList.add('hidden');
          document.getElementById('userInfoBadge').innerText = `Thiết bị: ${CURRENT_MTB}`;
          document.getElementById('warningModal').classList.remove('hidden');
          await autoFetchLatestBackupOnStart();
        }, 500);

      } else {
        statusDiv.className = "text-xs text-center font-medium text-rose-400";
        statusDiv.innerText = "❌ " + (resData.message || "Sai Mã thiết bị hoặc Mật khẩu!");
      }
    } catch (err) {
      console.error("Lỗi xác thực:", err);
      statusDiv.className = "text-xs text-center font-medium text-rose-400";
      statusDiv.innerText = "❌ Lỗi kết nối hệ thống!";
    } finally {
      loginBtn.disabled = false;
    }
  }

  function closeWarningModal() {
    document.getElementById('warningModal').classList.add('hidden');
  }

  async function autoFetchLatestBackupOnStart() {
    if (!CURRENT_MTB) return;
    try {
      const res = await fetch(`${BACKUP_SCRIPT_URL}?mtb=${encodeURIComponent(CURRENT_MTB)}`);
      const listData = await res.json();

      if (listData && listData.length > 0) {
        const latestItem = listData[listData.length - 1];
        const fullJsonData = (latestItem.mainData || "") + (latestItem.subData || "") || latestItem.backupData;
        
        if (fullJsonData) {
          dbFiles = typeof fullJsonData === 'string' ? JSON.parse(fullJsonData) : fullJsonData;
        }
      } else {
        dbFiles = [];
      }
    } catch (e) {
      console.error("Lỗi đọc dữ liệu cá nhân:", e);
    } finally {
      renderBreadcrumb();
      renderFiles(getCurrentFolderItems());
      updateStorageUsage();
    }
  }

  async function autoTriggerAllBackups() {
    await Promise.all([
      autoSaveMainDatabase(),
      autoExportBackupToCloud()
    ]);
  }

  // SỬA LỖI 4: Gửi kèm msgId để Backend thực hiện Cập nhật tin nhắn cũ
  async function autoSaveMainDatabase() {
    if (!BOT_TOKEN || !CHAT_ID) return;
    try {
      const res = await fetch('/api/pin-db', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ 
          token: BOT_TOKEN, 
          chatId: CHAT_ID, 
          mtb: CURRENT_MTB, 
          dbData: dbFiles,
          msgId: PINNED_MSG_ID 
        })
      });
      const data = await res.json();
      if (data.success && data.msgId) {
        PINNED_MSG_ID = data.msgId;
        localStorage.setItem('cur_msg_id', PINNED_MSG_ID);
      }
    } catch (e) {}
  }

  async function autoExportBackupToCloud() {
    if (!CURRENT_MTB) return;
    const currentTimeStr = new Date().toLocaleString('vi-VN');
    try {
      await fetch('/api/save-backup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          mtb: CURRENT_MTB,
          time: currentTimeStr,
          backupData: JSON.stringify(dbFiles),
          overwrite: false
        })
      });
    } catch (err) {
      console.error("Lỗi sao lưu lên Cloud Drive:", err);
    }
  }

  async function startBatchUploadQueue() {
    const input = document.getElementById('fileInput');
    const files = Array.from(input.files);

    if (files.length === 0) return;

    if (!MAX_STORAGE_GB) {
      alert("❌ Chưa lấy được khai báo dung lượng hệ thống!");
      return;
    }

    const totalNewBytes = files.reduce((sum, f) => sum + f.size, 0);
    const currentUsedBytes = dbFiles.reduce((sum, item) => sum + (item.size || 0), 0);
    const maxAllowedBytes = MAX_STORAGE_GB * 1024 * 1024 * 1024;

    if (currentUsedBytes + totalNewBytes > maxAllowedBytes) {
      const freeBytes = Math.max(0, maxAllowedBytes - currentUsedBytes);
      alert(`❌ Dung lượng khả dụng không đủ!\n\n• Đã dùng: ${formatBytes(currentUsedBytes)} / ${MAX_STORAGE_GB} GB\n• Còn trống: ${formatBytes(freeBytes)}\n• Tổng tệp tải lên: ${formatBytes(totalNewBytes)}\n\nVui lòng xóa bớt tệp hoặc nâng hạn mức GB!`);
      input.value = '';
      return;
    }

    input.disabled = true;

    const progressModal = document.getElementById('progressModal');
    const progressBar = document.getElementById('progressBar');
    const percentText = document.getElementById('percentText');
    const statusText = document.getElementById('statusText');
    const queueCountText = document.getElementById('queueCountText');

    progressModal.classList.remove('hidden');

    isUploading = true;
    isPaused = false;
    isCancelled = false;
    document.getElementById('pauseBtn').innerText = "⏸️ Tạm Dừng";

    let successCount = 0;

    try {
      for (let i = 0; i < files.length; i++) {
        if (isCancelled) break;

        const file = files[i];
        queueCountText.innerText = `Đang xử lý file ${i + 1}/${files.length}`;
        
        const uploadedItem = await uploadChunkedFile(file, statusText, progressBar, percentText);
        if (uploadedItem) {
          dbFiles.unshift(uploadedItem);
          renderFiles(getCurrentFolderItems());
          updateStorageUsage();
          successCount++;
        }
      }

      if (successCount > 0) {
        progressBar.style.width = '100%';
        percentText.innerText = '100%';
        await autoTriggerAllBackups();
      }

    } finally {
      isUploading = false;
      input.disabled = false;

      if (isCancelled) {
        statusText.innerText = "🛑 Đã hủy tiến trình tải lên.";
      } else {
        statusText.innerText = `🎉 Hoàn tất! Đã tải lên ${successCount}/${files.length} tệp.`;
        input.value = '';
        setTimeout(() => {
          if (!isUploading) {
            progressModal.classList.add('hidden');
            progressBar.style.width = '0%';
            percentText.innerText = '0%';
          }
        }, 2500);
      }
    }
  }

  async function uploadChunkedFile(file, statusText, progressBar, percentText) {
    const totalChunks = Math.ceil(file.size / CHUNK_SIZE);
    const chunkFileIds = [];
    const fileIdUnique = "file_" + Date.now() + "_" + Math.random().toString(36).substr(2, 5);

    const speedText = document.getElementById('speedText');
    const etaText = document.getElementById('etaText');

    for (let chunkIndex = 0; chunkIndex < totalChunks; chunkIndex++) {
      if (isCancelled) return null;
      while (isPaused && !isCancelled) await new Promise(r => setTimeout(r, 300));
      if (isCancelled) return null;

      const start = chunkIndex * CHUNK_SIZE;
      const end = Math.min(file.size, start + CHUNK_SIZE);
      const chunkBlob = file.slice(start, end);

      statusText.innerText = `📦 ${file.name} (Mảnh ${chunkIndex + 1}/${totalChunks} - 10MB)`;

      let fileId = null;
      let retries = 3;

      while (retries > 0 && !fileId && !isCancelled) {
        fileId = await uploadSingleChunkXHR(chunkBlob, (percent, speedMBs, etaSec) => {
          let overallPercent = Math.round(((start + (chunkBlob.size * (percent / 100))) / file.size) * 100);
          if (overallPercent > 100) overallPercent = 100;

          progressBar.style.width = overallPercent + '%';
          percentText.innerText = overallPercent + '%';
          speedText.innerText = `Tốc độ: ${speedMBs} MB/s`;
          etaText.innerText = `Còn lại: ${etaSec}s`;
        });

        if (!fileId) {
          retries--;
          if (retries > 0) {
            statusText.innerText = `⚠️ Lỗi mạng / Tự động điều tiết tốc độ (Retry ${3 - retries}/3)...`;
            await new Promise(r => setTimeout(r, 2000));
          }
        }
      }

      if (fileId) {
        chunkFileIds.push(fileId);
      } else {
        alert(`❌ Tải lên thất bại ở phần ${chunkIndex + 1} của tệp ${file.name}`);
        return null;
      }
    }

    progressBar.style.width = '100%';
    percentText.innerText = '100%';

    return {
      id: fileIdUnique,
      name: file.name,
      size: file.size,
      chunks: chunkFileIds,
      isFolder: false,
      parentId: currentFolderId,
      date: new Date().toLocaleString('vi-VN')
    };
  }

  function uploadSingleChunkXHR(blob, onProgress) {
    return new Promise((resolve) => {
      const formData = new FormData();
      formData.append('token', BOT_TOKEN);
      formData.append('chatId', CHAT_ID);
      formData.append('document', blob);

      currentXHR = new XMLHttpRequest();
      currentXHR.open('POST', '/api/upload-chunk', true);

      let lastLoaded = 0;
      let lastTime = Date.now();

      currentXHR.upload.onprogress = (e) => {
        if (e.lengthComputable) {
          let percent = Math.round((e.loaded / e.total) * 100);
          if (percent > 100) percent = 100;
          
          const now = Date.now();
          const timeDiff = (now - lastTime) / 1000;
          if (timeDiff >= 0.5 || e.loaded === e.total) {
            const loadedDiff = e.loaded - lastLoaded;
            const speed = timeDiff > 0 ? (loadedDiff / timeDiff) / (1024 * 1024) : 0;
            const remainingBytes = e.total - e.loaded;
            const eta = speed > 0 ? Math.round(remainingBytes / (speed * 1024 * 1024)) : 0;

            onProgress(percent, speed.toFixed(2), eta);
            lastLoaded = e.loaded;
            lastTime = now;
          }
        }
      };

      currentXHR.onload = function() {
        if (currentXHR.status === 200) {
          try {
            const data = JSON.parse(currentXHR.responseText);
            if (data.success) {
              onProgress(100, "0.00", 0);
              resolve(data.file_id);
            } else resolve(null);
          } catch (e) {
            resolve(null);
          }
        } else resolve(null);
      };

      currentXHR.onerror = () => resolve(null);
      currentXHR.send(formData);
    });
  }

  // SỬA LỖI 3: Dùng Promise.all() Tải Song Song Tất Cả Các Mảnh File Cùng Lúc
  async function fetchFileBlobFromItem(item, onProgress) {
    const chunkIds = item.chunks || [item.id];
    let loadedCount = 0;

    const downloadPromises = chunkIds.map(async (chunkId, index) => {
      const proxiedUrl = `/api/file-proxy?token=${BOT_TOKEN}&fileId=${chunkId}&filename=${encodeURIComponent(item.name)}`;
      const res = await fetch(proxiedUrl);
      if (!res.ok) throw new Error(`Lỗi khi tải mảnh file ${index + 1}`);

      const blob = await res.blob();
      loadedCount++;
      if (onProgress) onProgress(loadedCount, chunkIds.length);
      return { index, blob };
    });

    // Kích hoạt tất cả HTTP requests tải song song
    const results = await Promise.all(downloadPromises);

    // Sắp xếp lại đúng thứ tự các mảnh file ban đầu
    results.sort((a, b) => a.index - b.index);
    const blobs = results.map(r => r.blob);

    return new Blob(blobs, { type: 'application/octet-stream' });
  }

  async function downloadFileById(itemId) {
    const item = dbFiles.find(f => f.id === itemId);
    if (!item) return alert("❌ Không tìm thấy thông tin tệp!");

    const progressModal = document.getElementById('progressModal');
    const progressBar = document.getElementById('progressBar');
    const percentText = document.getElementById('percentText');
    const statusText = document.getElementById('statusText');
    const queueCountText = document.getElementById('queueCountText');

    progressModal.classList.remove('hidden');
    queueCountText.innerText = "Đang tải các mảnh song song...";

    try {
      let fullBlob;
      if (previewCache.has(itemId)) {
        fullBlob = previewCache.get(itemId);
      } else {
        fullBlob = await fetchFileBlobFromItem(item, (current, total) => {
          const percent = Math.round((current / total) * 100);
          progressBar.style.width = percent + '%';
          percentText.innerText = percent + '%';
          statusText.innerText = `📥 Tải song song các mảnh (${current}/${total}): ${item.name}`;
        });
        previewCache.set(itemId, fullBlob);
      }

      progressBar.style.width = '100%';
      percentText.innerText = '100%';
      statusText.innerText = "✅ Hoàn tất ghép file! Đang lưu xuống máy...";
      const link = document.createElement('a');
      link.href = URL.createObjectURL(fullBlob);
      link.download = item.name;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(link.href);
    } catch (err) {
      alert("❌ Lỗi trong quá trình kết nối và ghép file: " + err.message);
    } finally {
      setTimeout(() => {
        progressModal.classList.add('hidden');
        progressBar.style.width = '0%';
        percentText.innerText = '0%';
      }, 2000);
    }
  }

  async function previewFile(itemId) {
    const item = dbFiles.find(f => f.id === itemId);
    if (!item) return;

    const modal = document.getElementById('previewModal');
    const title = document.getElementById('previewTitle');
    const content = document.getElementById('previewContent');
    const downloadBtn = document.getElementById('previewDownloadBtn');

    title.innerText = `👁️ Đang xem: ${item.name}`;
    downloadBtn.onclick = () => downloadFileById(itemId);
    modal.classList.remove('hidden');

    let fullBlob;
    if (previewCache.has(itemId)) {
      content.innerHTML = `<div class="text-emerald-400 text-xs font-semibold">⚡ Đã tải từ bộ nhớ đệm nhanh!</div>`;
      fullBlob = previewCache.get(itemId);
      await new Promise(r => setTimeout(r, 200));
    } else {
      content.innerHTML = `<div class="text-amber-400 text-xs font-semibold animate-pulse">⏳ Đang tải song song các phần của file...</div>`;
      try {
        fullBlob = await fetchFileBlobFromItem(item);
        previewCache.set(itemId, fullBlob);
      } catch (err) {
        content.innerHTML = `<div class="text-rose-400 text-xs font-semibold">❌ Không thể tải hoặc ghép nội dung xem trước!</div>`;
        return;
      }
    }

    try {
      const url = URL.createObjectURL(fullBlob);
      const ext = item.name.split('.').pop().toLowerCase();

      if (['jpg', 'jpeg', 'png', 'gif', 'webp', 'svg'].includes(ext)) {
        content.innerHTML = `<img src="${url}" class="max-h-[70vh] max-w-full rounded-lg object-contain border border-slate-700 shadow-md" alt="${item.name}">`;
      } else if (['mp4', 'webm', 'ogg', 'mov'].includes(ext)) {
        content.innerHTML = `<video controls src="${url}" class="max-h-[70vh] max-w-full rounded-lg shadow-md"></video>`;
      } else if (['mp3', 'wav', 'm4a'].includes(ext)) {
        content.innerHTML = `<audio controls src="${url}" class="w-full max-w-md"></audio>`;
      } else if (['txt', 'json', 'js', 'html', 'css', 'csv', 'md'].includes(ext)) {
        const text = await fullBlob.text();
        content.innerHTML = `<pre class="text-xs text-emerald-400 font-mono w-full max-h-[65vh] overflow-auto text-left whitespace-pre-wrap bg-slate-950 p-4 rounded-lg border border-slate-800">${escapeHtml(text)}</pre>`;
      } else if (ext === 'pdf') {
        content.innerHTML = `<iframe src="${url}" class="w-full h-[65vh] rounded-lg border border-slate-700"></iframe>`;
      } else {
        content.innerHTML = `
          <div class="text-center space-y-3 p-4">
            <div class="text-4xl">📄</div>
            <div class="text-xs text-slate-300">Định dạng <strong>.${ext}</strong> không hỗ trợ xem trực tiếp.</div>
            <button onclick="downloadFileById('${itemId}')" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-4 py-2 rounded-xl font-semibold">
              ⬇️ Tải Xuống Ngay
            </button>
          </div>`;
      }
    } catch (err) {
      content.innerHTML = `<div class="text-rose-400 text-xs font-semibold">❌ Lỗi hiển thị nội dung xem trước!</div>`;
    }
  }

  function closePreviewModal() {
    document.getElementById('previewModal').classList.add('hidden');
  }

  async function downloadSelectedItems() {
    const checkedBoxes = Array.from(document.querySelectorAll('.item-checkbox:checked'));
    if (checkedBoxes.length === 0) return;

    const items = checkedBoxes.map(cb => dbFiles.find(f => f.id === cb.value)).filter(f => f && !f.isFolder);
    if (items.length === 0) return alert("⚠️ Vui lòng chọn tệp lẻ để tải xuống!");

    const downloadBtn = document.getElementById('downloadSelectedBtn');
    downloadBtn.disabled = true;

    for (let i = 0; i < items.length; i++) {
      await downloadFileById(items[i].id);
      await new Promise(r => setTimeout(r, 1000));
    }

    downloadBtn.disabled = false;
  }

  function togglePauseUpload() {
    if (!isUploading) return;
    isPaused = !isPaused;
    const pauseBtn = document.getElementById('pauseBtn');
    const statusText = document.getElementById('statusText');

    if (isPaused) {
      pauseBtn.innerText = "▶️ Tiếp Tục";
      statusText.innerText = "⏸️ Tiến trình tạm dừng...";
    } else {
      pauseBtn.innerText = "⏸️ Tạm Dừng";
    }
  }

  function cancelUpload() {
    if (confirm("Bạn có chắc chắn muốn HỦY tiến trình tải lên?")) {
      isCancelled = true;
      isPaused = false;
      if (currentXHR) currentXHR.abort();
    }
  }

  function closeProgressWidget() {
    if (isUploading && !confirm("Tiến trình đang chạy. Bạn có chắc muốn đóng?")) return;
    document.getElementById('progressModal').classList.add('hidden');
  }

  async function deleteSelectedItems() {
    const checkedBoxes = Array.from(document.querySelectorAll('.item-checkbox:checked'));
    if (checkedBoxes.length === 0) return;

    if (!confirm(`Bạn có chắc chắn muốn xóa ${checkedBoxes.length} mục đã chọn?`)) return;

    const deleteBtn = document.getElementById('deleteSelectedBtn');
    deleteBtn.disabled = true;

    for (let i = 0; i < checkedBoxes.length; i++) {
      const id = checkedBoxes[i].value;
      dbFiles = dbFiles.filter(f => f.id !== id);
      if (previewCache.has(id)) previewCache.delete(id);
    }

    renderFiles(getCurrentFolderItems());
    updateStorageUsage();

    await autoTriggerAllBackups();

    deleteBtn.disabled = false;
    document.getElementById('selectAllCheckbox').checked = false;
    toggleSelectAll({ checked: false });
    alert("✅ Đã xóa hoàn tất!");
  }

  async function deleteSingleItem(id) {
    const item = dbFiles.find(f => f.id === id);
    if (!item || !confirm(`Xóa vĩnh viễn "${item.name}"?`)) return;

    dbFiles = dbFiles.filter(f => f.id !== id);
    if (previewCache.has(id)) previewCache.delete(id);

    renderFiles(getCurrentFolderItems());
    updateStorageUsage();

    await autoTriggerAllBackups();
  }

  async function createNewFolder() {
    const folderName = prompt("Nhập tên thư mục mới:");
    if (!folderName || !folderName.trim()) return;

    dbFiles.unshift({
      id: "folder_" + Date.now(),
      name: folderName.trim(),
      isFolder: true,
      parentId: currentFolderId,
      date: new Date().toLocaleString('vi-VN')
    });

    renderFiles(getCurrentFolderItems());
    await autoTriggerAllBackups();
  }

  function getCurrentFolderItems() {
    return dbFiles.filter(item => (item.parentId || null) === currentFolderId);
  }

  function openFolder(folderId) {
    currentFolderId = folderId;
    renderBreadcrumb();
    renderFiles(getCurrentFolderItems());
  }

  function renderBreadcrumb() {
    const breadcrumbBar = document.getElementById('breadcrumbBar');
    let path = [{ id: null, name: "🏠 Trang Chủ" }];
    let curr = currentFolderId;
    let tempStack = [];

    while (curr) {
      const found = dbFiles.find(item => item.id === curr);
      if (found) {
        tempStack.unshift({ id: found.id, name: found.name });
        curr = found.parentId;
      } else break;
    }

    path = path.concat(tempStack);
    breadcrumbBar.innerHTML = path.map((node, index) => {
      const isLast = index === path.length - 1;
      return isLast 
        ? `<span class="font-bold text-indigo-400 flex items-center gap-1">${node.name}</span>`
        : `<button onclick="openFolder(${node.id ? `'${node.id}'` : 'null'})" class="hover:text-indigo-300 font-medium transition">${node.name}</button> <span class="text-slate-500">/</span>`;
    }).join(' ');
  }

  function renderFiles(items) {
    const tbody = document.getElementById('fileTableBody');
    document.getElementById('fileCountBadge').innerText = items.length;

    if (items.length === 0) {
      tbody.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-slate-500">Thư mục trống.</td></tr>`;
      return;
    }

    tbody.innerHTML = items.map(item => {
      return `
        <tr class="hover:bg-slate-700/30 transition">
          <td class="p-4"><input type="checkbox" value="${item.id}" onchange="updateBatchButtonsVisibility()" class="item-checkbox rounded bg-slate-900 border-slate-700 text-indigo-600"></td>
          <td class="p-4 font-semibold text-slate-200">
            ${item.isFolder ? '📁 ' + item.name : '📄 ' + item.name}
          </td>
          <td class="p-4 text-slate-400 text-xs">${item.isFolder ? '--' : formatBytes(item.size)}</td>
          <td class="p-4 text-slate-400 text-xs">${item.date}</td>
          <td class="p-4 text-right space-x-1.5">
            ${item.isFolder 
              ? `<button onclick="openFolder('${item.id}')" class="bg-amber-600/20 hover:bg-amber-600/40 text-amber-300 border border-amber-500/30 px-3 py-1.5 rounded-xl text-xs font-semibold">📂 Mở</button>`
              : `
                <button onclick="previewFile('${item.id}')" class="bg-indigo-600/20 hover:bg-indigo-600/40 text-indigo-300 border border-indigo-500/30 px-2.5 py-1.5 rounded-xl text-xs font-semibold">👁️ Xem</button>
                <button onclick="downloadFileById('${item.id}')" class="bg-emerald-600/20 hover:bg-emerald-600/40 text-emerald-300 border border-emerald-500/30 px-2.5 py-1.5 rounded-xl text-xs font-semibold">⬇️ Tải</button>
              `}
            <button onclick="deleteSingleItem('${item.id}')" class="bg-rose-600/20 hover:bg-rose-600/40 text-rose-300 border border-rose-500/30 px-2.5 py-1.5 rounded-xl text-xs font-semibold">🗑️ Xóa</button>
          </td>
        </tr>`;
    }).join('');
  }

  function toggleSelectAll(mainCheckbox) {
    const checkboxes = document.querySelectorAll('.item-checkbox');
    checkboxes.forEach(cb => cb.checked = mainCheckbox.checked);
    updateBatchButtonsVisibility();
  }

  function updateBatchButtonsVisibility() {
    const checkedBoxes = document.querySelectorAll('.item-checkbox:checked');
    const deleteBtn = document.getElementById('deleteSelectedBtn');
    const downloadBtn = document.getElementById('downloadSelectedBtn');

    if (checkedBoxes.length > 0) {
      deleteBtn.classList.remove('hidden');
      downloadBtn.classList.remove('hidden');
    } else {
      deleteBtn.classList.add('hidden');
      downloadBtn.classList.add('hidden');
    }
  }

  async function openBackupHistoryModal() {
    const modal = document.getElementById('backupModal');
    const container = document.getElementById('backupListContainer');
    modal.classList.remove('hidden');
    container.innerHTML = `<div class="text-center py-6 text-amber-400 text-xs font-semibold">⏳ Đang lấy danh sách bản sao lưu...</div>`;

    try {
      const res = await fetch(`${BACKUP_SCRIPT_URL}?mtb=${encodeURIComponent(CURRENT_MTB)}`);
      const listData = await res.json();

      if (!listData || listData.length === 0) {
        container.innerHTML = `<div class="text-center py-6 text-slate-500 text-xs">Tài khoản này chưa có bản sao lưu nào.</div>`;
        return;
      }

      const recent3Backups = listData.slice(-3).reverse();

      container.innerHTML = recent3Backups.map((item, index) => {
        const fullJsonData = (item.mainData || "") + (item.subData || "") || item.backupData;
        const encodedData = encodeURIComponent(fullJsonData);
        
        return `
          <div class="bg-slate-900 border border-purple-500/30 p-3.5 rounded-xl space-y-2.5">
            <div class="flex items-center justify-between">
              <div>
                <div class="text-xs font-bold text-slate-100">🕒 Bản lưu #${recent3Backups.length - index}: ${item.time}</div>
              </div>
              <span class="text-[10px] bg-purple-500/20 text-purple-300 px-2 py-0.5 rounded border border-purple-500/30">
                MTB: ${CURRENT_MTB}
              </span>
            </div>

            <div class="flex justify-end pt-1">
              <button onclick="applyBackupFromCloud('${encodedData}')" class="bg-purple-600 hover:bg-purple-500 text-white text-xs px-3 py-1.5 rounded-lg font-semibold transition flex items-center gap-1">
                📥 Khôi Phục Bản Lưu Này
              </button>
            </div>
          </div>
        `;
      }).join('');

    } catch (err) {
      container.innerHTML = `<div class="text-center py-6 text-rose-400 text-xs">❌ Lỗi kết nối danh sách sao lưu!</div>`;
    }
  }

  function closeBackupModal() {
    document.getElementById('backupModal').classList.add('hidden');
  }

  async function applyBackupFromCloud(encodedJsonData) {
    try {
      const jsonStr = decodeURIComponent(encodedJsonData);
      const importedData = JSON.parse(jsonStr);

      if (Array.isArray(importedData)) {
        if (confirm(`Khôi phục ${importedData.length} mục từ bản sao lưu này?`)) {
          dbFiles = importedData;
          previewCache.clear();
          renderBreadcrumb();
          renderFiles(getCurrentFolderItems());
          updateStorageUsage();
          
          await autoTriggerAllBackups();
          closeBackupModal();
          alert("🎉 Khôi phục dữ liệu thành công!");
        }
      }
    } catch (e) {
      alert("❌ Lỗi dữ liệu sao lưu!");
    }
  }

  function filterFiles() {
    const search = document.getElementById('searchInput').value.toLowerCase();
    const currentItems = getCurrentFolderItems();

    const filtered = currentItems.filter(item => {
      return item.name.toLowerCase().includes(search);
    });

    renderFiles(filtered);
  }

  function updateStorageUsage() {
    const storageUsageText = document.getElementById('storageUsageText');
    const progressBar = document.getElementById('storageProgressBar');

    if (!MAX_STORAGE_GB) {
      if (storageUsageText) {
        storageUsageText.innerText = "Đang cập nhật dung lượng...";
      }
      if (progressBar) {
        progressBar.style.width = "0%";
      }
      return;
    }

    const maxBytes = MAX_STORAGE_GB * 1024 * 1024 * 1024;
    const totalBytes = dbFiles.reduce((sum, item) => sum + (item.size || 0), 0);
    const usedPercentage = Math.min(100, ((totalBytes / maxBytes) * 100).toFixed(1));
    
    if (storageUsageText) {
      storageUsageText.innerText = `${formatBytes(totalBytes)} / ${MAX_STORAGE_GB} GB (${usedPercentage}%)`;
    }
    if (progressBar) {
      progressBar.style.width = `${usedPercentage}%`;
    }
  }

  function logout() {
    localStorage.clear();
    location.reload();
  }

  function formatBytes(bytes) {
    if (!bytes || bytes === 0) return '0 Bytes';
    const k = 1024;
    const sizes = ['Bytes', 'KB', 'MB', 'GB'];
    const i = Math.floor(Math.log(bytes) / Math.log(k));
    return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
  }

  function escapeHtml(text) {
    return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
  }
</script>
